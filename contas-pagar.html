<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Marpex | Contas a Pagar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-navegador.css">
    <link rel="stylesheet" href="style-financeiro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style-mobile.css">
</head>
<body>

<div class="main-layout" style="display:flex;">
    <aside></aside>

    <main>
        <div class="topbar">
            <div class="topbar-left">
                <h2><i class="fa-solid fa-arrow-up"></i> Contas a Pagar</h2>
            </div>
            <div class="topbar-right">
                <div class="user-info-card">
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-details">
                        <div class="user-name" id="displayUsername">User...</div>
                        <div class="user-email" id="userEmail">usuario@email.com</div>
                    </div>
                </div>
                <div class="logout" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
            </div>
        </div>

        <div class="content">

            <!-- Resumo -->
            <div class="fin-summary">
                <div class="fin-card">
                    <div class="fin-card-icon laranja"><i class="fa-solid fa-clock"></i></div>
                    <div class="fin-card-info">
                        <div class="fin-card-label">A Pagar</div>
                        <div class="fin-card-valor" id="totalPendente">R$ 0,00</div>
                    </div>
                </div>
                <div class="fin-card">
                    <div class="fin-card-icon vermelho"><i class="fa-solid fa-circle-exclamation"></i></div>
                    <div class="fin-card-info">
                        <div class="fin-card-label">Vencido</div>
                        <div class="fin-card-valor vermelho" id="totalVencido">R$ 0,00</div>
                    </div>
                </div>
                <div class="fin-card">
                    <div class="fin-card-icon verde"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="fin-card-info">
                        <div class="fin-card-label">Pago este mês</div>
                        <div class="fin-card-valor verde" id="totalPago">R$ 0,00</div>
                    </div>
                </div>
            </div>

            <!-- Filtro + ações -->
            <div class="page-header" style="margin:16px 20px 0;">
                <div class="header-left">
                    <div class="filter-wrapper">
                        <i class="fa-solid fa-magnifying-glass filter-icon"></i>
                        <input type="text" id="filtroContas" placeholder="Filtrar por descrição ou fornecedor..." oninput="cpFiltrar()">
                    </div>
                    <select class="filter-select" id="filtroStatus" onchange="cpFiltrar()" style="margin-left:10px;">
                        <option value="">Todos os status</option>
                        <option value="pendente">Pendente</option>
                        <option value="vencido">Vencido</option>
                        <option value="pago">Pago</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>
                <div class="header-right">
                    <button class="btn-cadastrar" onclick="cpAbrirModal()">
                        <i class="fa-solid fa-plus"></i> Nova Conta
                    </button>
                </div>
            </div>

            <!-- Tabela -->
            <div class="fin-table-wrap">
                <table class="fin-table">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Fornecedor</th>
                            <th>Valor</th>
                            <th>Vencimento</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="cpTbody">
                        <tr><td colspan="6" style="padding:60px;text-align:center;color:#94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>
</div>

<!-- Modal criar/editar -->
<div class="fin-modal-overlay" id="cpModalOverlay" onclick="cpFecharModal()">
    <div class="fin-modal" onclick="event.stopPropagation()">
        <div class="fin-modal-header">
            <h3 id="cpModalTitulo"><i class="fa-solid fa-arrow-up"></i> Nova Conta a Pagar</h3>
            <button class="fin-modal-close" onclick="cpFecharModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="fin-modal-body">
            <input type="hidden" id="cpEditId">

            <div class="fin-form-row">
                <div class="fin-form-group fin-full">
                    <label>Descrição <span style="color:#ef4444">*</span></label>
                    <input type="text" id="cpDescricao" placeholder="Ex: Frete internacional DHL">
                </div>
            </div>
            <div class="fin-form-row">
                <div class="fin-form-group fin-full">
                    <label>Fornecedor / Parceiro</label>
                    <input type="text" id="cpFornecedorNome" placeholder="Buscar parceiro..." autocomplete="off" oninput="cpBuscarParceiro(this.value)">
                    <input type="hidden" id="cpFornecedorId">
                    <div class="pl-autocomplete" id="cpAutoParceiro"></div>
                </div>
            </div>
            <div class="fin-form-row">
                <div class="fin-form-group">
                    <label>Vincular a Pedido</label>
                    <input type="text" id="cpPedidoNome" placeholder="Buscar pedido por número..." autocomplete="off" oninput="cpBuscarPedido(this.value)">
                    <input type="hidden" id="cpPedidoId">
                    <div class="pl-autocomplete" id="cpAutoPedido"></div>
                </div>
                <div class="fin-form-group">
                    <label>Vincular a Processo</label>
                    <input type="text" id="cpProcessoNome" placeholder="Buscar processo por número..." autocomplete="off" oninput="cpBuscarProcesso(this.value)">
                    <input type="hidden" id="cpProcessoId">
                    <div class="pl-autocomplete" id="cpAutoProcesso"></div>
                </div>
            </div>
            <div class="fin-form-row">
                <div class="fin-form-group">
                    <label>Valor <span style="color:#ef4444">*</span></label>
                    <input type="number" id="cpValor" placeholder="0,00" min="0" step="0.01">
                </div>
                <div class="fin-form-group">
                    <label>Moeda</label>
                    <select id="cpMoeda">
                        <option value="BRL">BRL</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                    </select>
                </div>
            </div>
            <div class="fin-form-row">
                <div class="fin-form-group">
                    <label>Vencimento <span style="color:#ef4444">*</span></label>
                    <input type="date" id="cpVencimento">
                </div>
                <div class="fin-form-group">
                    <label>Data de Pagamento</label>
                    <input type="date" id="cpDataPagamento">
                </div>
            </div>
            <div class="fin-form-row">
                <div class="fin-form-group">
                    <label>Status</label>
                    <select id="cpStatus">
                        <option value="pendente">Pendente</option>
                        <option value="pago">Pago</option>
                        <option value="vencido">Vencido</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>
                <div class="fin-form-group">
                    <label>Categoria</label>
                    <select id="cpCategoria">
                        <option value="">Selecione...</option>
                        <option value="frete">Frete</option>
                        <option value="imposto">Imposto / Taxa</option>
                        <option value="fornecedor">Fornecedor</option>
                        <option value="operacional">Operacional</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
            </div>
            <div class="fin-form-row">
                <div class="fin-form-group fin-full">
                    <label>Observações</label>
                    <textarea id="cpObservacoes" placeholder="Detalhes adicionais..."></textarea>
                </div>
            </div>
        </div>
        <div class="fin-modal-footer">
            <button class="fin-btn-cancelar" onclick="cpFecharModal()">Cancelar</button>
            <button class="fin-btn-salvar" id="cpBtnSalvar" onclick="cpSalvar()">
                <i class="fa-solid fa-floppy-disk"></i> Salvar
            </button>
        </div>
    </div>
</div>

<!-- Modal excluir -->
<div class="fin-modal-overlay" id="cpModalExcluirOverlay" onclick="cpFecharModalExcluir()">
    <div class="fin-modal" style="width:400px" onclick="event.stopPropagation()">
        <div class="fin-modal-header">
            <h3><i class="fa-solid fa-trash"></i> Excluir Conta</h3>
            <button class="fin-modal-close" onclick="cpFecharModalExcluir()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="fin-modal-body">
            <p style="color:#64748b;font-size:14px;">Tem certeza que deseja excluir <strong id="cpExcluirNome"></strong>? Esta ação não pode ser desfeita.</p>
        </div>
        <div class="fin-modal-footer">
            <button class="fin-btn-cancelar" onclick="cpFecharModalExcluir()">Cancelar</button>
            <button class="fin-btn-confirmar-excluir" id="cpBtnConfirmarExcluir" onclick="cpConfirmarExcluir()">
                <i class="fa-solid fa-trash"></i> Excluir
            </button>
        </div>
    </div>
</div>

<div class="dashboard-footer">
    <span>© 2025 Marpex · Todos os direitos reservados</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-api.js"></script>
<script src="auth.js"></script>
<script src="navegador.js"></script>
<script src="contas-pagar.js"></script>
<script src="suporte.js"></script>
</body>
</html>
