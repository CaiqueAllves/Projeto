<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Marpex | Central de Chamados</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-navegador.css">
    <link rel="stylesheet" href="style-chamados-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style-mobile.css">
</head>

<body>

<div class="main-layout" style="display: flex;">
    <aside></aside>

    <main>
        <div class="topbar">
            <div class="topbar-left">
                <h2><i class="fa-solid fa-headset"></i> Central de Chamados</h2>
            </div>
            <div class="topbar-right">
                <div class="user-info-card">
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-details">
                        <div class="user-name" id="displayUsername">User...</div>
                        <div class="user-email" id="userEmail">usuario@email.com</div>
                    </div>
                </div>
                <div class="logout" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
            </div>
        </div>

        <div class="content" style="padding:32px; display:flex; flex-direction:column; gap:20px;">

            <div class="filtros-container">
                <div class="busca-container">
                    <input type="text" id="buscaChamado" placeholder="Buscar por título, solicitante ou empresa..." oninput="cadRenderizar()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="filtros-btns">
                    <button class="filtro-btn active" data-status="todos"        onclick="cadFiltrar('todos')"><i class="fa-solid fa-list"></i> Todos</button>
                    <button class="filtro-btn"        data-status="aberto"       onclick="cadFiltrar('aberto')"><i class="fa-solid fa-inbox"></i> Abertos</button>
                    <button class="filtro-btn"        data-status="em_andamento" onclick="cadFiltrar('em_andamento')"><i class="fa-solid fa-spinner"></i> Em andamento</button>
                    <button class="filtro-btn"        data-status="resolvido"    onclick="cadFiltrar('resolvido')"><i class="fa-solid fa-check-circle"></i> Resolvidos</button>
                </div>
            </div>

            <div id="cadLista" class="cad-lista">
                <div class="cad-vazio"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando...</div>
            </div>
        </div>

        <footer class="dashboard-footer">
            <span>© 2026 Marpex — Todos os direitos reservados</span>
            <span class="footer-version">v3.0</span>
        </footer>
    </main>
</div>

<!-- MODAL — DETALHE DO CHAMADO -->
<div class="cad-overlay" id="cadModal" style="display:none;" onclick="if(event.target===this) cadFecharModal()">
    <div class="cad-modal">
        <div class="cad-modal-header">
            <div>
                <h3 id="cadModalTitulo">Chamado</h3>
                <p id="cadModalSub"></p>
            </div>
            <button class="cad-modal-fechar" onclick="cadFecharModal()" title="Fechar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cad-modal-body">
            <div class="cad-status-row">
                <label for="cadModalStatus">Status</label>
                <select id="cadModalStatus" onchange="cadMudarStatus(this.value)">
                    <option value="aberto">Aberto</option>
                    <option value="em_andamento">Em andamento</option>
                    <option value="resolvido">Resolvido</option>
                </select>
            </div>
            <div class="cad-descricao" id="cadModalDesc"></div>
            <div id="cadModalAnexo"></div>
            <h4>Conversa</h4>
            <div class="cad-thread" id="cadModalThread"></div>
        </div>
        <div class="cad-modal-footer">
            <textarea id="cadModalResposta" rows="2" placeholder="Responder ao usuário..."></textarea>
            <button class="cad-enviar" id="cadModalEnviar" onclick="cadEnviarResposta()"><i class="fa-solid fa-paper-plane"></i> Enviar</button>
        </div>
    </div>
</div>

<script src="supabase.min.js"></script>
<script src="supabase-api.js"></script>
<script src="auth.js"></script>
<script src="navegador.js"></script>
<script src="chamados-admin.js"></script>
<script src="suporte.js"></script>
</body>
</html>
