<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://mvgbgjqkxsptbndgoskw.supabase.co wss://mvgbgjqkxsptbndgoskw.supabase.co https://viacep.com.br https://brasilapi.com.br https://api.emailjs.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
    <meta name="theme-color" content="#4776ec">
    <link rel="icon" type="image/svg+xml" href="icons/marpex.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Marpex">
    <script src="pwa.js?v=499b88dd"></script>
    <title>Marpex | Central de Chamados</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-base.css?v=0e82b1a5">
    <link rel="stylesheet" href="style-navegador.css?v=eda2ee95">
    <link rel="stylesheet" href="style-chamados-admin.css?v=a77a7569">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style-mobile.css?v=4d316938">
</head>

<body>

<div class="main-layout" style="display: flex;">
    <aside></aside>

    <main>
        <div class="topbar">
            <div class="topbar-left">
                <h2><i class="fa-solid fa-headset"></i> Central de Chamados</h2>
            </div>
            <div class="topbar-right">
                <div class="user-info-card">
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-details">
                        <div class="user-name" id="displayUsername">User...</div>
                        <div class="user-email" id="userEmail">usuario@email.com</div>
                    </div>
                </div>
                <div class="logout" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
            </div>
        </div>

        <div class="content" style="padding:32px; display:flex; flex-direction:column; gap:20px;">

            <div class="filtros-container">
                <div class="cad-busca-grupo">
                    <div class="busca-container">
                        <input type="text" id="buscaChamado" placeholder="Buscar em todos os campos..." oninput="cadRenderizar()">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <select id="buscaCampo" class="cad-busca-campo" onchange="cadTrocarCampoBusca()" title="Filtrar por">
                        <option value="todos">Todos os campos</option>
                        <option value="chamado">Chamado</option>
                        <option value="usuario">Usuário</option>
                        <option value="empresa">Empresa</option>
                        <option value="modulo">Módulo</option>
                    </select>
                </div>
                <div class="filtros-btns">
                    <button class="filtro-btn active" data-status="todos"        onclick="cadFiltrar('todos')"><i class="fa-solid fa-list"></i> Todos</button>
                    <button class="filtro-btn"        data-status="aberto"       onclick="cadFiltrar('aberto')"><i class="fa-solid fa-inbox"></i> Abertos</button>
                    <button class="filtro-btn"        data-status="em_andamento" onclick="cadFiltrar('em_andamento')"><i class="fa-solid fa-spinner"></i> Em andamento</button>
                    <button class="filtro-btn"        data-status="resolvido"    onclick="cadFiltrar('resolvido')"><i class="fa-solid fa-check-circle"></i> Resolvidos</button>
                    <button class="filtro-btn"        data-status="novidades"    onclick="cadFiltrar('novidades')"><i class="fa-solid fa-bell"></i> Novidades <span class="cad-contagem" id="cadContagemNovidades" style="display:none;">0</span></button>
                </div>
            </div>

            <!-- Resumo: toque filtra a lista (chamados-admin.js → _cadRenderResumo) -->
            <div id="cadResumo" class="cad-resumo"></div>

            <div id="cadLista" class="cad-lista">
                <div class="cad-vazio"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando...</div>
            </div>
        </div>

        <footer class="dashboard-footer">
            <span>© 2026 Marpex — Todos os direitos reservados</span>
            <span class="footer-version">v3.0</span>
        </footer>
    </main>
</div>

<!-- MODAL — DETALHE DO CHAMADO -->
<div class="cad-overlay" id="cadModal" style="display:none;" onclick="if(event.target===this) cadFecharModal()">
    <div class="cad-modal">
        <div class="cad-modal-header">
            <div class="cad-header-linha">
                <div class="cad-header-titulo">
                    <span class="cad-num-pill" id="cadModalNum"></span>
                    <h3 id="cadModalTitulo">Chamado</h3>
                </div>
                <div class="cad-header-acoes">
                    <select id="cadModalStatus" class="cad-status-select" onchange="cadMudarStatus(this.value)" title="Alterar status">
                        <option value="aberto">Aberto</option>
                        <option value="em_andamento">Em andamento</option>
                        <option value="resolvido">Resolvido</option>
                    </select>
                    <button class="cad-modal-fechar" onclick="cadFecharModal()" title="Fechar (Esc)"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="cad-chips" id="cadModalChips"></div>
        </div>

        <div class="cad-modal-body" id="cadModalBody">
            <section class="cad-card">
                <p class="cad-card-label"><i class="fa-solid fa-circle-info"></i> Problema relatado <span id="cadModalQuando"></span></p>
                <div class="cad-descricao" id="cadModalDesc"></div>
                <div id="cadModalAnexo"></div>
            </section>

            <p class="cad-card-label cad-conversa-label"><i class="fa-regular fa-comments"></i> Conversa <span id="cadModalContagem"></span></p>
            <div class="cad-thread" id="cadModalThread"></div>
        </div>

        <div class="cad-anexo-chip" id="cadAnexoChip" style="display:none;">
            <img id="cadAnexoThumb" alt="" style="display:none;">
            <span id="cadAnexoNome"></span>
            <button type="button" onclick="cadRemoverAnexo()" title="Remover anexo"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cad-modal-footer">
            <label class="cad-clipe" title="Anexar imagem ou print (ou cole com Ctrl+V)">
                <i class="fa-solid fa-paperclip"></i>
                <input type="file" id="cadModalArquivo" accept="image/*,.pdf" style="display:none;" onchange="cadEscolherAnexo(this.files[0])">
            </label>
            <textarea id="cadModalResposta" rows="1" placeholder="Responder ao usuário..." oninput="cadAjustarAltura(this)"></textarea>
            <button class="cad-enviar" id="cadModalEnviar" onclick="cadEnviarResposta()"><i class="fa-solid fa-paper-plane"></i> Enviar</button>
        </div>
        <p class="cad-dica">Enter envia · Shift+Enter quebra a linha · Ctrl+V cola um print</p>
    </div>
</div>

<div class="cad-lightbox" id="cadLightbox" style="display:none;" onclick="cadFecharLightbox()">
    <img id="cadLightboxImg" alt="Anexo ampliado">
</div>

<script src="supabase.min.js?v=ba2e1d14"></script>
<script src="supabase-api.js?v=0643ed38"></script>
<script src="auth.js?v=bb4a57a3"></script>
<script src="navegador.js?v=1113c2e2"></script>
<script src="chamados-admin.js?v=bb62f09b"></script>
<script src="suporte.js?v=1debcf1b"></script>
</body>
</html>
