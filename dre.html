<head>

    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
    <meta name="theme-color" content="#4776ec">
    <link rel="icon" type="image/svg+xml" href="icons/marpex.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Marpex">
    <script src="pwa.js?v=6b117d57"></script>
    <title>Marpex | DRE / Balancete</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-base.css?v=1eac11cb">
    <link rel="stylesheet" href="style-navegador.css?v=eda2ee95">
    <link rel="stylesheet" href="style-financeiro.css?v=97ee7401">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous">
    <link rel="stylesheet" href="style-mobile.css?v=4d316938">
</head>
<body>

<div class="main-layout" style="display:flex;">
    <aside></aside>

    <main>
        <div class="topbar">
            <div class="topbar-left">
                <h2><i class="fa-solid fa-table-columns"></i> DRE / Balancete</h2>
            </div>
            <div class="topbar-right">
                <div class="user-info-card">
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-details">
                        <div class="user-name" id="displayUsername">User...</div>
                        <div class="user-email" id="userEmail">usuario@email.com</div>
                    </div>
                </div>
                <div class="logout" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
            </div>
        </div>

        <div class="content">

            <!-- Período -->
            <div class="fin-periodo-wrap">
                <label for="dreInicio"><i class="fa-regular fa-calendar"></i> Período:</label>
                <input type="month" id="dreInicio" onchange="dreCarregar()">
                <span style="color:#94a3b8">até</span>
                <input type="month" id="dreFim" onchange="dreCarregar()">
                <button onclick="dreCarregar()" style="padding:7px 16px;background:#4776ec;color:white;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;">
                    <i class="fa-solid fa-rotate-right"></i> Atualizar
                </button>
            </div>

            <!-- Abas (Bloco 7 do Plano de Contas) -->
            <div class="dre-abas" role="tablist">
                <button type="button" class="dre-aba ativa" data-aba="resultado" onclick="dreAbrirAba('resultado')"><i class="fa-solid fa-table-list"></i> Resultado do período</button>
                <button type="button" class="dre-aba" data-aba="operacoes" onclick="dreAbrirAba('operacoes')"><i class="fa-solid fa-ship"></i> Por operação</button>
                <button type="button" class="dre-aba" data-aba="analise" onclick="dreAbrirAba('analise')"><i class="fa-solid fa-chart-pie"></i> Análise</button>
                <button type="button" class="dre-aba" data-aba="previsto" onclick="dreAbrirAba('previsto')"><i class="fa-solid fa-scale-balanced"></i> Previsto × Realizado</button>
            </div>
            <div class="dre-aviso" id="dreAviso" hidden></div>

            <!-- Resultado do período: indicadores (7.14) + DRE -->
            <div class="dre-painel" id="drePainelResultado">
                <div class="dre-indicadores" id="dreIndicadores"></div>
                <div class="dre-wrap">
                    <table class="dre-table" id="dreTable">
                        <tbody id="dreTbody">
                            <tr><td colspan="2" style="padding:60px;text-align:center;color:#94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Por operação: resultado e custo unitário de cada Proforma (7.15) -->
            <div class="dre-painel" id="drePainelOperacoes" hidden>
                <div class="dre-wrap dre-wrap-tabela" id="dreOperacoes"></div>
            </div>

            <!-- Análise gerencial por dimensão (7.17) -->
            <div class="dre-painel" id="drePainelAnalise" hidden>
                <div class="dre-analise-filtro">
                    <label for="dreDimensao">Analisar por</label>
                    <select id="dreDimensao" onchange="dreRenderAnalise()">
                        <option value="pais">País de destino</option>
                        <option value="cliente">Cliente (Importador)</option>
                        <option value="incoterm">Incoterm</option>
                        <option value="modal">Modal</option>
                        <option value="moeda">Moeda da operação</option>
                        <option value="fornecedor">Fornecedor (custos)</option>
                    </select>
                </div>
                <div class="dre-wrap dre-wrap-tabela" id="dreAnalise"></div>
            </div>

            <!-- Previsto × Realizado (7.16) -->
            <div class="dre-painel" id="drePainelPrevisto" hidden>
                <div class="dre-analise-filtro">
                    <label for="drePrevOperacao">Operação</label>
                    <select id="drePrevOperacao" onchange="dreRenderPrevisto()"></select>
                </div>
                <div class="dre-wrap dre-wrap-tabela" id="drePrevisto"></div>
            </div>

        </div>
    </main>
</div>

<div class="dashboard-footer">
    <span>© 2025 Marpex · Todos os direitos reservados</span>
</div>

<script src="supabase.min.js?v=ba2e1d14"></script>
<script src="supabase-api.js?v=056c6d75"></script>
<script src="auth.js?v=37c2c7b0"></script>
<script src="navegador.js?v=43ffeccc"></script>
<script src="fin-moeda.js?v=0f017527"></script>
<script src="dre.js?v=5c888545"></script>
<script src="suporte.js?v=1debcf1b"></script>
</body>
</html>
