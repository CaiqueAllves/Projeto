<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Marpex | Produtos > Cadastro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-navegador.css">
    <link rel="stylesheet" href="style-cadastro.css">
    <link rel="stylesheet" href="style-produtos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style-mobile.css">
</head>

<body>

<div class="main-layout" style="display: flex;">
    <aside></aside>

    <main>
        <!-- TOPO -->
        <div class="topbar">
            <div class="topbar-left">
                <h2><i class="fa-solid fa-boxes-stacked"></i> Produtos</h2>
            </div>
            <div class="topbar-right">
                <div class="user-info-card">
                    <div class="user-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="user-details">
                        <div class="user-name" id="displayUsername">User...</div>
                        <div class="user-email" id="userEmail">usuario@email.com</div>
                    </div>
                </div>
                <div class="logout" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
            </div>
        </div>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="content">

            <!-- FILTRO + AÇÕES -->
            <div class="page-header">
                <div class="header-left">
                    <div class="filter-wrapper">
                        <i class="fa-solid fa-magnifying-glass filter-icon"></i>
                        <input type="text" id="filtroProdutos" placeholder="Filtrar por SKU, nome, categoria, NCM..." />
                    </div>
                </div>
                <div class="header-right">
                    <button class="btn-cadastrar" onclick="window.open('formularios.html?tab=produto', '_blank')">
                        <i class="fa-solid fa-plus"></i> Novo Produto
                    </button>
                    <button class="btn-upload" onclick="document.getElementById('uploadProdutos').click()">
                        <i class="fa-solid fa-upload"></i> Upload
                    </button>
                    <input type="file" id="uploadProdutos" accept=".xlsx,.xls,.pdf" style="display:none;" onchange="processarUploadProdutos(this)" />
                </div>
            </div>

            <!-- LISTA DE PRODUTOS -->
            <div class="empresas-lista" id="produtosLista">
                <div class="lista-header">
                    <span><i class="fa-solid fa-boxes-stacked"></i> Produtos Cadastrados</span>
                    <span class="lista-count" id="listaCount">—</span>
                </div>
                <div id="listaContainer" class="lista-scroll">
                    <div class="lista-vazia">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Carregando...
                    </div>
                </div>
            </div>

            <!-- RODAPÉ -->
            <footer class="dashboard-footer">
                <span>© 2026 Marpex — Todos os direitos reservados</span>
                <span class="footer-version">v3.0</span>
            </footer>
        </div>
    </main>
</div>

<!-- =============================================
     MODAL: CONFIRMAR EXCLUSÃO
============================================== -->
<div class="modal-overlay" id="modalExcluir" onclick="fecharModalExcluir()">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 480px;">
        <div class="modal-header" style="border-bottom: 2px solid #fee2e2;">
            <h3 style="color:#dc2626;"><i class="fa-solid fa-triangle-exclamation"></i> Excluir Produto</h3>
        </div>
        <div class="modal-body">
            <p style="color:#374151; margin-bottom:16px;">Tem certeza que deseja excluir este produto? Esta ação não pode ser desfeita.</p>
            <div id="excluirProdutoInfo" style="background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:16px;"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="fecharModalExcluir()">Cancelar</button>
            <button id="btnConfirmarExcluir" style="background:#dc2626; color:white; border:none; padding:10px 24px; border-radius:8px; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-trash"></i> Excluir
            </button>
        </div>
    </div>
</div>

<script src="supabase.min.js"></script>
<script src="supabase-api.js"></script>
<script src="auth.js"></script>
<script src="navegador.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if (typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<script src="produtos.js"></script>
<script src="suporte.js"></script>

</body>
</html>
