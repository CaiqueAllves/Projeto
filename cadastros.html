<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://mvgbgjqkxsptbndgoskw.supabase.co wss://mvgbgjqkxsptbndgoskw.supabase.co https://viacep.com.br https://brasilapi.com.br https://api.emailjs.com https://olinda.bcb.gov.br https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
    <meta name="theme-color" content="#4776ec">
    <link rel="icon" type="image/svg+xml" href="icons/marpex.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Marpex">
    <script src="pwa.js?v=6b117d57"></script>
    <title>Marpex | Empresas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-base.css?v=fcfe125a">
    <link rel="stylesheet" href="style-navegador.css?v=eda2ee95">
    <link rel="stylesheet" href="style-cadastro.css?v=2c563d82">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous">
    <link rel="stylesheet" href="style-mobile.css?v=4d316938">
</head>

<body>

<div class="main-layout" style="display: flex;">
    <aside></aside>

    <main>
        <!-- TOPO -->
        <div class="topbar">
            <div class="topbar-left">
                <h2><i class="fa-solid fa-chart-line"></i> Empresas</h2>
            </div>
            <div class="topbar-right">
                <div class="user-info-card">
                    <div class="user-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="user-details">
                        <div class="user-name" id="displayUsername">User...</div>
                        <div class="user-email" id="userEmail">usuario@email.com</div>
                    </div>
                </div>
                <div class="logout" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
            </div>
        </div>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="content">

            <!-- FILTRO + AÇÕES -->
            <div class="page-header">
                <div class="header-left">
                    <div class="filter-wrapper">
                        <i class="fa-solid fa-magnifying-glass filter-icon"></i>
                        <input type="text" id="filterInput" placeholder="Filtrar por nome, documento, cidade, tag..." />
                    </div>
                </div>
                <div class="header-right">
                    <button class="btn-cadastrar" onclick="window.open('formularios.html?tab=empresa', '_blank')">
                        <i class="fa-solid fa-plus"></i> Cadastrar
                    </button>
                    <button class="btn-modelo" onclick="baixarModeloEmpresaExcel()" title="Planilha modelo para cadastrar uma empresa pelo Upload">
                        <i class="fa-solid fa-download"></i> Modelo
                    </button>
                    <button class="btn-upload" onclick="document.getElementById('uploadInput').click()">
                        <i class="fa-solid fa-upload"></i> Upload
                    </button>
                    <input type="file" id="uploadInput" accept=".xlsx,.xls,.pdf" style="display: none;" onchange="processarUpload(this)" />
                </div>
            </div>

            <!-- LISTA DE EMPRESAS -->
            <div class="empresas-lista" id="empresasLista">
                <div class="lista-header">
                    <span><i class="fa-solid fa-building"></i> Empresas Cadastradas</span>
                    <span class="lista-count" id="listaCount">—</span>
                </div>
                <div id="listaContainer" class="lista-scroll">
                    <div class="lista-vazia">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Carregando...
                    </div>
                </div>
            </div>

            <!-- RODAPÉ -->
            <footer class="dashboard-footer">
                <span>© 2026 Marpex — Todos os direitos reservados</span>
                <span class="footer-version">v3.0</span>
            </footer>
        </div>
    </main>
</div>

<!-- =============================================
     MODAL: CONFIRMAR EXCLUSÃO
============================================== -->
<div class="modal-overlay" id="modalExcluir" onclick="fecharModalExcluir()">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 480px;">
        <div class="modal-header" style="border-bottom: 2px solid #fee2e2;">
            <h3 style="color:#dc2626;"><i class="fa-solid fa-triangle-exclamation"></i> Excluir Empresa</h3>
        </div>
        <div class="modal-body" style="padding: 24px;">
            <p style="color:#374151; margin-bottom:16px;">Tem certeza que deseja excluir esta empresa? Esta ação não pode ser desfeita.</p>
            <div id="excluirEmpresaInfo" style="background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:16px; margin-bottom:16px;"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="fecharModalExcluir()">Cancelar</button>
            <button id="btnConfirmarExcluir" style="background:#dc2626; color:white; border:none; padding:10px 24px; border-radius:8px; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-trash"></i> Excluir
            </button>
        </div>
    </div>
</div>

<script src="supabase.min.js?v=ba2e1d14"></script>
<script src="supabase-api.js?v=93662f8c"></script>
<script src="auth.js?v=443d3cf2"></script>
<script src="cadastros.js?v=f0e83591"></script>
<script src="navegador.js?v=43ffeccc"></script>
<script src="suporte.js?v=1debcf1b"></script>

</body>
</html>
