<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Marpex | Documentos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- A tela Documentos virou a janela "Documentos" do card de cada Proforma
         (proforma.html). Este arquivo só redireciona links/abas antigos. -->
    <script>
        (function () {
            var q = new URLSearchParams(location.search);
            var id = q.get('proforma_id');
            var extra = q.get('semabas') ? 'semabas=' + encodeURIComponent(q.get('semabas')) : '';
            var params = [id ? 'docs=' + encodeURIComponent(id) : '', extra].filter(Boolean).join('&');
            location.replace('proforma.html' + (params ? '?' + params : ''));
        })();
    </script>
</head>
<body></body>
</html>
