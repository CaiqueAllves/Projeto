<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4776ec">
    <title>Marpex | Sem conexão</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: linear-gradient(135deg, #4776ec 0%, #4271e9 50%, #3b5bdb 100%);
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
        img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
        h1 { font-size: 22px; margin: 22px 0 8px; }
        p { margin: 0 0 24px; opacity: .9; line-height: 1.5; max-width: 320px; }
        button { background: #fff; color: #3b5bdb; border: none; border-radius: 10px; padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <img src="icons/icon-192.png" alt="Marpex">
        <h1>Sem conexão com a internet</h1>
        <p>O Marpex precisa de internet para mostrar os dados atualizados. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
        <button onclick="location.reload()">Tentar de novo</button>
    </div>
</body>
</html>
